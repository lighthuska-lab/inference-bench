[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inference-bench"
version = "0.1.0"
description = "Benchmark non-streaming OpenAI-compatible inference endpoints."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Light Huska", email = "lighthuska@gmail.com"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
inference-bench = "inference_bench.cli:main"

[project.urls]
Repository = "https://github.com/lighthuska-lab/inference-bench"
Issues = "https://github.com/lighthuska-lab/inference-bench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_bench"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
