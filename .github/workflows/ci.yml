name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install tooling and project
        run: python -m pip install . -r requirements-dev.txt
      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Verify installed entry points outside the source tree
        run: |
          cd "$(mktemp -d)"
          inference-bench --version
          python -m inference_bench --help
